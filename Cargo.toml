[package]
name = "binstale"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Running-binary staleness detector: classifies running processes as fresh | deleted-exe | inode-drift | prov-stale | behind-head"
publish = false

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_must_use = "deny"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "warn"
mem_forget = "deny"
as_conversions = "warn"
float_arithmetic = "warn"
dbg_macro = "deny"
# CLI binary: eprintln!/println! to stderr/stdout are intentional
print_stdout = "allow"
print_stderr = "allow"

module_name_repetitions = "allow"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# In a binary crate with private modules, pub(crate) satisfies unreachable_pub
# but clippy::redundant_pub_crate flags it; allow it here.
redundant_pub_crate = "allow"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xattr = "1"
regex = "1"
thiserror = "2"
toml = { version = "0.8", default-features = false, features = ["parse"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
